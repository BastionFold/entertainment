      <path d="m13.5 25 7.2 7.2L35 17" stroke-width="2.8" />
      <path d="M17.1 28.6h3.6M27.8 24.2v-3.1h3.1" stroke-width="1.25" />
      <g fill="#e5a62e" stroke="none">
        <circle cx="13.5" cy="25" r="1.8" />
