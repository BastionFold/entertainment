<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="480" height="480" role="img" aria-label="Entertainment clapperboard">
  <title>Entertainment parent C — clapperboard</title>
  <defs>
    <filter id="trace-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur" />
      <feFlood flood-color="#e5a62e" flood-opacity="0.45" />
      <feComposite in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Layer 0: Bastion Fold logo, in its entirety (verbatim paths/colors) -->
  <g transform="translate(48 57) scale(0.72) translate(-24 -24)">
